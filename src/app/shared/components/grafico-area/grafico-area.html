<div class="grafico">
  <div class="lienzo">
    <svg [attr.viewBox]="'0 0 ' + ancho + ' ' + alto" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="relleno-area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.38" />
          <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path [attr.d]="area" fill="url(#relleno-area)" />
      <path [attr.d]="linea" class="trazo" />
    </svg>
    @for (punto of puntos; track $index) {
      <span class="punto" [style.left.%]="(punto.x / ancho) * 100" [style.top.%]="(punto.y / alto) * 100"></span>
    }
  </div>
  <div class="etiquetas">
    @for (etiqueta of etiquetas; track etiqueta) {
      <span>{{ etiqueta }}</span>
    }
  </div>
</div>
