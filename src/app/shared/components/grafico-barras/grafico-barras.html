@if (horizontal) {
  <ul [class]="'filas barras-' + color">
    @for (barra of barras; track barra.etiqueta) {
      <li>
        <span class="etiqueta-fila">{{ barra.etiqueta }}</span>
        <span class="pista-fila">
          <span class="relleno" [style.width.%]="porcentaje(barra)"></span>
        </span>
        <strong class="valor-fila">{{ barra.valor }}</strong>
      </li>
    }
  </ul>
} @else {
  <div [class]="'barras barras-' + color" [style.height.px]="alto">
    @for (barra of barras; track barra.etiqueta) {
      <div class="columna">
        <span class="valor">{{ barra.valor }}</span>
        <div class="pista">
          <div class="relleno" [style.height.%]="porcentaje(barra)"></div>
        </div>
        <span class="etiqueta">{{ barra.etiqueta }}</span>
      </div>
    }
  </div>
}
