<div class="fila" [class.propia]="propio()">
  @if (ia()) {
    <span class="marca-ia">
      <span class="material-symbols-rounded">auto_awesome</span>
    </span>
  }
  <div class="burbuja" [class.burbuja-ia]="ia()">
    @if (autor() || hora()) {
      <div class="meta">
        <strong>{{ autor() }}</strong>
        <span>{{ hora() }}</span>
      </div>
    }
    <div class="contenido">
      <ng-content></ng-content>
    </div>
  </div>
</div>
