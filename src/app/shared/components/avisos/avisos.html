<div class="avisos" aria-live="polite">
  @for (aviso of avisos.lista(); track aviso.id) {
    <div [class]="'aviso vidrio aviso-' + aviso.tipo" role="status">
      <span class="material-symbols-rounded">{{ iconos[aviso.tipo] }}</span>
      <p>{{ aviso.texto }}</p>
      <button type="button" aria-label="Cerrar aviso" (click)="avisos.quitar(aviso.id)">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  }
</div>
